org.gradle.caching=true
org.gradle.jvmargs=-Xmx4g
org.gradle.parallel=true

# Micronaut core, test and platform versions must be bumped together
micronautCoreVersion=5.2.25
micronautTestVersion=5.2.0
micronautPlatformVersion=5.2.8

# Groovy/Spock lines. Micronaut 5 modules need Groovy 5; non-Micronaut modules stay on
# Groovy 4 because they are also consumed by Micronaut 4 apps (Groovy 4 runtime).
groovyVersion=4.0.31
spockVersion=2.3-groovy-4.0
micronautGroovyVersion=5.0.8
micronautSpockVersion=2.4-groovy-5.0
