plugins {
    id 'io.seqera.micronaut-library-conventions'
    id 'io.seqera.groovy-library-conventions'
    id "io.micronaut.minimal.library" version '4.5.3'
}

group = 'io.seqera'
version = "${project.file('VERSION').text.trim()}"

dependencies {
    // Micronaut core
    implementation "io.micronaut:micronaut-inject:${micronautCoreVersion}"
    implementation "io.micronaut:micronaut-runtime:${micronautCoreVersion}"

    // JSON serialization
    implementation project(':lib-serde-jackson')

    // The work queue this command queue is built on. `api`, not `implementation`:
    // CommandQueue publicly extends AbstractWorkQueue and callers construct a
    // RedisWorkQueue / LocalWorkQueue to hand to it, so those types are part of
    // this module's surface.
    api project(':lib-data-workqueue')
    implementation project(':lib-serde-moshi')

    // State store. `api`, not `implementation`: CommandState publicly implements
    // VersionAware, so the interface is part of this module's surface.
    api project(':lib-data-store-state-redis')

    // Utilities (includes type resolution)
    implementation project(':lib-lang')

    // TSID for ID generation
    implementation 'com.github.f4b6a3:tsid-creator:5.2.6'

    // SLF4J logging
    implementation 'org.slf4j:slf4j-api:2.0.17'

    // Test dependencies
    testImplementation testFixtures(project(':lib-fixtures-redis'))
    // The Redis backend is a test-only dependency: RedisWorkQueue replicas are built by
    // hand in the lease container tests (CommandServiceLeaseRedisTest)
    testImplementation project(':lib-data-workqueue-redis')
    // JedisPool is wired directly into those manually-built RedisWorkQueue replicas; the
    // Groovy compiler also resolves the full CommandQueue supertype hierarchy, which
    // reaches lib-retry (an `implementation` dep of lib-data-workqueue, so not transitive)
    testImplementation 'redis.clients:jedis:5.1.4'
    testImplementation project(':lib-retry')
    testImplementation "io.micronaut:micronaut-inject-groovy:${micronautCoreVersion}"
    testImplementation "io.micronaut.test:micronaut-test-spock:${micronautTestVersion}"
    testImplementation 'org.apache.groovy:groovy'
    testImplementation 'com.github.f4b6a3:tsid-creator:5.2.6'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.testcontainers:testcontainers:1.21.4'
    testRuntimeOnly 'ch.qos.logback:logback-classic:1.5.25'
}

test {
    useJUnitPlatform()
}

micronaut {
    version '4.8.3'
    runtime("netty")
    processing {
        incremental(true)
    }
    importMicronautPlatform = false
}
