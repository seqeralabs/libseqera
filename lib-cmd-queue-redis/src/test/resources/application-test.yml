# Test configuration for lib-data-command-queue

micronaut:
  application:
    name: lib-data-command-queue-test

# Command queue configuration
command:
  poll-interval: 100ms
  max-concurrency: 25
  state:
    ttl: 1h

command-queue:
  poll-interval: 100ms
  checker:
    enabled: true
    interval: 500ms

# Local queue retry pacing: keep redelivery cycles fast in tests (prod default is 1s)
workqueue:
  local:
    retry-delay: 100ms
